<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orange Shirt Day & Beyond — Truth • Resilience • Future</title>
<style>
:root{--orange:#e96f24;--deep:#31251f;--cream:#fff8ef;--gold:#f5b544;--sage:#496a5b;--blue:#385b73;--paper:#fffdf8;--line:#decfbd}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#fff7ed,#f8efe3);color:var(--deep);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
header{background:linear-gradient(120deg,#b94d16,#ef7d2c);color:white;padding:26px 18px 20px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #0002}
.wrap{max-width:1050px;margin:auto}.brand{display:flex;gap:18px;align-items:center}.shirt{width:62px;height:54px;background:#ff8b34;clip-path:polygon(18% 0,35% 10%,65% 10%,82% 0,100% 22%,83% 38%,80% 100%,20% 100%,17% 38%,0 22%);filter:drop-shadow(0 2px 2px #0004)}
h1{font-size:clamp(1.5rem,4vw,2.4rem);margin:0;line-height:1.05} .sub{margin:.25rem 0 0;font-weight:700}
.progress{height:8px;background:#ffffff55;border-radius:99px;margin-top:15px;overflow:hidden}.bar{height:100%;background:#ffe4a5;width:0;transition:.35s}
main{max-width:1050px;margin:24px auto;padding:0 16px 100px}.journey{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tick{border:1px solid #d6c4af;background:#fff;border-radius:999px;padding:7px 11px;white-space:nowrap;font-weight:700;cursor:pointer}.tick.active{background:var(--deep);color:white}.tick.lock{opacity:.38;cursor:not-allowed}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px #4a2c1814;padding:clamp(20px,4vw,42px);min-height:520px}
.eyebrow{font-weight:900;letter-spacing:.12em;color:#9b471c;font-size:.82rem;text-transform:uppercase}.phase{display:inline-block;border-radius:99px;background:#fff0df;padding:5px 10px;font-weight:800;color:#9b471c;margin-right:6px}
h2{font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.08;margin:.35rem 0 1rem} h3{margin-top:1.6rem}
.hero{text-align:center;padding:30px 10px}.hero .bigshirt{width:180px;height:160px;background:var(--orange);clip-path:polygon(18% 0,35% 10%,65% 10%,82% 0,100% 22%,83% 38%,80% 100%,20% 100%,17% 38%,0 22%);margin:15px auto;display:grid;place-items:center;color:white;font-weight:900;font-size:1.15rem;text-shadow:0 1px 2px #0006}
.quote{font-size:1.2rem;border-left:5px solid var(--orange);padding:12px 18px;background:#fff3e6;border-radius:0 12px 12px 0}.source{font-size:.86rem;color:#6e6258}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile,.choice,.activity{border:1px solid var(--line);background:white;border-radius:14px;padding:15px;text-align:left;cursor:pointer;font:inherit}.tile:hover,.choice:hover,.activity:hover{border-color:var(--orange);transform:translateY(-1px)}.tile strong,.activity strong{display:block;font-size:1.05rem}
.reveal{display:none;margin-top:12px;padding:15px;border-left:5px solid var(--gold);background:#fff4d9;border-radius:0 12px 12px 0}.reveal.show{display:block}
.decision{margin-top:24px;padding:20px;border:2px solid #efd4b6;border-radius:16px;background:#fffaf4}.choice{display:block;width:100%;margin:8px 0}.choice.selected{border:2px solid var(--orange);background:#fff0e5;font-weight:700}.feedback{margin-top:12px;padding:14px;background:#f4f0e8;border-left:5px solid var(--sage);border-radius:0 12px 12px 0}
.video{position:relative;padding-top:56.25%;border-radius:15px;overflow:hidden;background:#222;margin:18px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
a{color:#8b3c16;font-weight:700}.callout{padding:16px;border-radius:14px;background:#eef4f0;border:1px solid #cad9d0}.warning{background:#fff2e8;border-color:#efc7a9}
.web{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:20px 0}.node{padding:10px 14px;border-radius:99px;background:#f3e5d6;font-weight:800}
.faces{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.person{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.person .cat{font-size:.76rem;letter-spacing:.08em;font-weight:900;color:#9b471c}
.calendar{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.month{padding:13px;border-radius:13px;background:white;border:1px solid var(--line)}.month strong{display:block;color:#9b471c}
.teacher{margin-top:25px;border-top:2px dashed #dfb98f;padding-top:18px}.teacher summary{cursor:pointer;font-weight:900;color:#7d3b19}.activities{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}.activity{cursor:default}.tag{font-size:.75rem;background:#eee4d9;border-radius:99px;padding:3px 8px;display:inline-block;margin-top:7px}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--deep);color:white}.secondary{background:#e9ded2;color:var(--deep)}.btn:disabled{opacity:.35;cursor:not-allowed}
.finalshirt{transition:opacity 1s}.fade{opacity:.12}
@media(max-width:600px){header{position:relative}.card{min-height:auto}.controls{position:sticky;bottom:0;background:#fff8ef;padding:10px 0}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div class="shirt" aria-hidden="true"></div><div><h1>Orange Shirt Day & Beyond</h1><div class="sub">Truth • Resilience • Future</div></div></div><div class="progress"><div class="bar" id="bar"></div></div></div></header>
<main>
<div class="journey" id="journey"></div>
<section class="card" id="stage"></section>
<div class="controls"><button class="btn secondary" id="back">← Previous</button><button class="btn primary" id="next">Continue →</button></div>
</main>
<script>
const stages=[
{d:"BEGIN",phase:"Journey",t:"September 30 is one day. This story is much bigger.",b:`<div class="hero"><div class="bigshirt">WHY<br>ORANGE?</div><p>Before you begin, make a prediction. Why do you think an orange shirt became a national symbol?</p><p class="source">You do not need to write anything yet. This experience is about looking, listening, choosing and thinking.</p></div>`,q:"What is your best prediction?",o:["Orange was chosen as a general colour of hope.","The colour comes from a real child's experience at residential school.","Orange was selected by the federal government.","It represents one specific First Nation."],f:[
["Reasonable guess","Orange can symbolize many things, but this movement has a much more specific origin. Keep going."],
["Good prediction","Yes. The meaning begins with one child's experience. You are about to hear that story from Phyllis Webstad."],
["Keep investigating","Orange Shirt Day began as a grassroots commemoration, not as a colour selected by the federal government."],
["Keep investigating","Orange Shirt Day grew from one person's story, but its message now honours children and Survivors across many Indigenous Nations and communities."]]},
{d:"THE SHIRT",phase:"Truth",t:"Meet Phyllis Webstad",b:`<p>Phyllis Webstad is Northern Secwépemc from the Stswecem’c Xget’tem First Nation. In 1973, when she was six, her grandmother bought her a bright new orange shirt for her first day at St. Joseph Mission residential school. When Phyllis arrived, her clothes — including the orange shirt — were taken from her.</p><div class="quote">“My story started with one orange shirt, but it became something so much bigger than I ever imagined.”</div><p class="source">Source: Orange Shirt Society — Phyllis Webstad's Story.</p><div class="callout"><strong>Listen to Phyllis in her own words.</strong><br>The Orange Shirt Society provides a 7-minute classroom video: <a href="https://orangeshirtday.org/resources/videos/" target="_blank" rel="noopener">Phyllis Webstad on Orange Shirt Day ↗</a></div><p><a href="https://orangeshirtday.org/about/phyllis-story/" target="_blank" rel="noopener">Read Phyllis's story ↗</a></p>`,q:"After hearing Phyllis's story, what does “Every Child Matters” ask us to recognize?",o:["Children deserve dignity, identity, family connection and to be heard.","It is mainly a slogan for one commemorative day each year.","It means every child should have exactly the same cultural experience.","It is only about children who personally attended residential schools."],f:[
["Strong reasoning","Phyllis describes how the loss of the shirt communicated that her feelings and identity did not matter. The phrase challenges that message."],
["Think further","September 30 creates a moment to remember, but the message is about the value of children and the continuing work of truth and reconciliation."],
["Consider the difference","Equal human dignity does not require identical cultures. Respect includes protecting children's languages, identities, families and communities."],
["Think bigger","The day honours Survivors and children who never returned home, while also asking Canadians to understand the wider legacy of the system."]]},
{d:"ONE CHILD → A SYSTEM",phase:"Truth",t:"Phyllis's experience was personal. The system was not.",b:`<p>Residential schools were part of a government- and church-run system designed around forced assimilation. Children were separated from families and communities, and Indigenous languages, cultures, traditions and knowledge systems were deliberately suppressed.</p><div class="grid">
<button class="tile" data-reveal="r1"><strong>Family</strong>What changes when children are separated?</button>
<button class="tile" data-reveal="r2"><strong>Language</strong>What happens when children are prevented from speaking?</button>
<button class="tile" data-reveal="r3"><strong>Identity</strong>What happens when a school tries to replace culture?</button>
<button class="tile" data-reveal="r4"><strong>Education</strong>Who decided what children should become?</button></div>
<div id="r1" class="reveal">Removing children interrupted everyday relationships through which care, stories, skills and knowledge pass between generations.</div>
<div id="r2" class="reveal">Language carries much more than vocabulary: stories, relationships, place-based knowledge and ways of understanding the world can be carried through language.</div>
<div id="r3" class="reveal">Forced assimilation targeted distinct Indigenous identities rather than respecting them.</div>
<div id="r4" class="reveal">Residential schooling was not simply ordinary schooling away from home. It was embedded in colonial policy and assimilation.</div>
<p class="source">Source: National Centre for Truth and Reconciliation, Residential School History.</p><details class="teacher"><summary>🍊 Teacher Activity Choices</summary><div class="activities"><div class="activity"><strong>Truth Timeline Sort</strong>Groups arrange key events and policies, then identify patterns.<br><span class="tag">20–30 min • Grades 8–12</span></div><div class="activity"><strong>Gallery Walk</strong>Post age-appropriate primary-source images or quotations. Students notice, wonder and connect.<br><span class="tag">20 min • Grades 7–12</span></div></div></details>`},
{d:"INTERRUPTED",phase:"Truth → Resilience",t:"What was interrupted — and what is being reclaimed?",b:`<p>Think about how knowledge moves through a community. It can pass through family, language, stories, land, ceremony, leadership and everyday life.</p><div class="web"><span class="node">Language</span><span class="node">Family</span><span class="node">Stories</span><span class="node">Land</span><span class="node">Ceremony</span><span class="node">Identity</span><span class="node">Leadership</span><span class="node">Knowledge</span></div><p>Residential schools disrupted many of these relationships. The effects did not simply disappear when the schools closed. But interruption is not the end of the story: Indigenous communities continue language revitalization, cultural renewal, healing, governance and education.</p><details class="teacher" open><summary>🍊 Featured Hands-On Activity — Knowledge Web</summary><div class="activities"><div class="activity"><strong>Build the Web</strong>Give groups cards or yarn labelled Language, Family, Stories, Land, Ceremony, Identity, Leadership and Knowledge. Students connect the pieces, then consider what happens when children are separated from the people who pass knowledge on. Revisit the web later and ask what reclamation can look like.<br><span class="tag">20–30 min • Grades 7–12</span></div></div></details>`,q:"If a system deliberately interrupts the passing of language, culture and knowledge, what can meaningful healing include?",o:["Remembering the past, but leaving cultural questions in the past.","Rebuilding and supporting languages, relationships, culture and community authority.","Expecting individuals to recover without changing institutions.","Assuming every Indigenous community needs the same solution."],f:[
["Consider what is missing","Remembering matters, but Survivors and communities have also called for concrete action, language and cultural revitalization, education and institutional change."],
["Strong reasoning","This connects truth to resilience: acknowledging harm while supporting Indigenous-led reclamation and self-determination."],
["Think beyond individuals","The harms were produced through systems and institutions. Responses can also involve governments, schools, organizations and society."],
["Important distinction","First Nations, Inuit and Métis communities are diverse. Reconciliation should not erase that diversity or prescribe one solution."]]},
{d:"LANGUAGE LIVES",phase:"Resilience",t:"Language is not a relic. It lives.",b:`<p><strong>FirstVoices</strong> is a community-driven platform where Indigenous communities manage, curate and share their own languages. Elders, youth, speakers and language champions create resources including words, phrases, songs and stories.</p><div class="callout"><strong>Explore, don't extract.</strong> Choose a language and listen respectfully. Notice who created the resource and how the community describes its language.</div><p><a href="https://www.firstvoices.com/" target="_blank" rel="noopener">Explore FirstVoices ↗</a></p><details class="teacher"><summary>🍊 Teacher Activity Choices</summary><div class="activities"><div class="activity"><strong>Language Lives</strong>Explore a community-managed language page. Students identify what language revitalization makes possible beyond learning vocabulary.<br><span class="tag">15–25 min • Grades 7–12</span></div><div class="activity"><strong>Listen & Notice</strong>Students listen to several words or phrases, then reflect on why hearing a living language changes the way we think about “loss.”<br><span class="tag">10–15 min • Grades 7–9</span></div></div></details>`},
{d:"EXCELLENCE",phase:"Resilience",t:"Indigenous excellence isn't history.",b:`<p>Indigenous people are athletes, artists, scientists, filmmakers, entrepreneurs, educators and leaders right now. Choose several people to explore. Your goal is not to memorize biographies — it is to notice the range of contemporary Indigenous excellence.</p><div class="faces">
<div class="person"><div class="cat">SPORT</div><strong>Brigette Lacquette</strong><br>Hockey player and Indigenous trailblazer.</div>
<div class="person"><div class="cat">SPORT</div><strong>Gavin McKenna</strong><br>Elite young hockey player proud of his Tr’ondëk Hwëch’in heritage.</div>
<div class="person"><div class="cat">SPORT</div><strong>Justina Di Stasio</strong><br>Champion wrestler and educator.</div>
<div class="person"><div class="cat">SPORT & ADVOCACY</div><strong>Waneek Horn-Miller</strong><br>Olympian and community advocate.</div>
<div class="person"><div class="cat">MUSIC</div><strong>Snotty Nose Rez Kids</strong><br>Haisla hip-hop artists.</div>
<div class="person"><div class="cat">FILM</div><strong>Devery Jacobs</strong><br>Actor, writer and filmmaker.</div>
<div class="person"><div class="cat">SCIENCE & MEDICINE</div><strong>Dr. Donna May Kimmaliardjuk</strong><br>Inuk physician and heart surgeon.</div>
<div class="person"><div class="cat">SPORT</div><strong>Ethan Bear</strong><br>Professional hockey player who has publicly celebrated Indigenous language and identity.</div>
</div><details class="teacher" open><summary>🍊 Teacher Activity Choices</summary><div class="activities"><div class="activity"><strong>Indigenous Excellence Cards</strong>Each student researches one contemporary Indigenous person and creates a display card: Nation/community, field, achievement, and why representation matters.<br><span class="tag">30–45 min • Grades 7–12</span></div><div class="activity"><strong>Then & Now Gallery</strong>Pair historical learning with contemporary Indigenous leadership and achievement so the story never stops at residential schools.<br><span class="tag">30–60 min • Grades 8–12</span></div></div></details>`,q:"Why include contemporary Indigenous excellence in an Orange Shirt Day learning experience?",o:["It replaces the need to learn difficult history.","It shows that Indigenous peoples should be understood through both historical truth and contemporary strength, identity and achievement.","It proves residential schools no longer have any effects.","It makes Orange Shirt Day mainly a celebration of famous people."],f:[
["Both are needed","Celebrating strength should not erase the truth. The goal is to hold truth and resilience together."],
["Strong reasoning","Exactly. Indigenous people are not confined to a historical chapter. Contemporary voices, leadership and achievement are part of the story."],
["Be careful","Resilience and success do not mean historical harms or continuing effects have disappeared."],
["Think wider","Role models are one window into resilience. Orange Shirt Day remains rooted in Survivors, children, truth and reconciliation."]]},
{d:"WHERE ARE YOU?",phase:"Truth → Future",t:"Whose lands and relationships are around you?",b:`<p>Reconciliation is also about relationships to land, Nations and treaties. Interactive maps can help you begin asking questions — but a map is a starting point, not the final authority.</p><div class="callout"><strong>Explore Native Land Digital</strong><br>Search your community and examine the Nations, languages and treaties shown. Then verify what you learn through the Nations' own websites and local treaty resources.</div><p><a href="https://native-land.ca/" target="_blank" rel="noopener">Open Native Land Digital ↗</a></p><p class="source">Native Land Digital notes that its mapped boundaries are not official or legal boundaries.</p><details class="teacher"><summary>🍊 Teacher Activity Choices</summary><div class="activities"><div class="activity"><strong>Where Are We?</strong>Students investigate the local treaty/territory and identify the Nations connected to the area.<br><span class="tag">20–30 min • Grades 7–12</span></div><div class="activity"><strong>Map → Nation</strong>After using the map, students visit one Nation's own website and compare what they learn.<br><span class="tag">25–40 min • Grades 9–12</span></div></div></details>`},
{d:"RECONCILIATION",phase:"Future",t:"From awareness to action",b:`<p>The Truth and Reconciliation Commission issued <strong>94 Calls to Action</strong> to redress the legacy of residential schools and advance reconciliation. They address governments, institutions, organizations and society — including education, language and culture, health, justice and other areas.</p><p><a href="https://nctr.ca/about/truth-and-reconciliation-commission-of-canada-calls-to-action/" target="_blank" rel="noopener">Explore the 94 Calls to Action at the NCTR ↗</a></p><div class="callout"><strong>NCTR's ReconciliACTION approach includes:</strong> learning history; understanding residential-school history and legacy; exploring treaty, constitutional, Indigenous and human rights; recognizing Indigenous contributions; taking action on injustices; and teaching others.</div>`,q:"Which of these can be part of reconciliation?",o:["Wearing an orange shirt.","Learning whose territory and treaty relationships are connected to where you live.","Reading Indigenous authors and listening to Indigenous voices.","Learning about and acting on the Calls to Action.","All of these — if they are connected to genuine learning, respect and continuing action."],f:[
["A beginning","Wearing orange can communicate remembrance and solidarity, but the symbol becomes more meaningful when connected to learning and action."],
["Yes","Understanding land, Nations and treaty relationships can deepen our understanding of responsibilities and relationships."],
["Yes","Listening to Indigenous-created work helps move learning beyond stereotypes and lets people speak for themselves."],
["Yes","The Calls to Action turn the broad idea of reconciliation into specific areas where change is being called for."],
["Strong synthesis","Reconciliation is not one gesture. Symbols, learning, relationships and concrete action can reinforce one another."]]},
{d:"CREATE",phase:"Future",t:"Make the learning visible",b:`<p>Teachers and classes can choose an activity that fits their age, time and setting. The goal is not to make a decoration first and add meaning later. <strong>Learn first. Create with purpose.</strong></p><div class="activities">
<div class="activity"><strong>🧡 Sticky-Note Meaning Wall</strong>Finish: “Orange Shirt Day means ___ to me because ___.” Build responses around a large orange shirt.<br><span class="tag">10–15 min • Grades 7–12</span></div>
<div class="activity"><strong>🧡 Truth • Resilience • Future Board</strong>Each student contributes one card: something Canada should understand, something Indigenous strength shows, or something they hope happens next.<br><span class="tag">15–25 min • Grades 7–12</span></div>
<div class="activity"><strong>🎨 Colour-by-Concept</strong>Answer simple learning questions to determine how sections of an Orange Shirt Day image are coloured.<br><span class="tag">15–25 min • Grades 7–8</span></div>
<div class="activity"><strong>🧩 Class Reconciliation Mosaic</strong>Each student creates one piece. Assemble them into one large orange-shirt image: every piece matters.<br><span class="tag">30–45 min • Grades 7–10</span></div>
<div class="activity"><strong>👕 Design an Orange Shirt</strong>Create a paper design representing Truth, Resilience or Future, with a one-sentence explanation.<br><span class="tag">20–30 min • Grades 7–10</span></div>
<div class="activity"><strong>🌈 Orange Tie-Dye</strong>Create an orange-themed tie-dye shirt after the learning. Add a short statement explaining what the shirt represents.<br><span class="tag">45 min + setting time • Grades 9–12</span></div>
<div class="activity"><strong>👣 Walk of Learning</strong>Create hallway footprints containing facts, Survivor-informed learning, Indigenous achievements or Calls to Action.<br><span class="tag">Whole school</span></div>
<div class="activity"><strong>⭐ Excellence Gallery</strong>Create profile cards for contemporary Indigenous athletes, artists, scientists, creators and leaders.<br><span class="tag">30–45 min • Grades 7–12</span></div>
</div><div class="callout warning" style="margin-top:16px"><strong>Respect the message.</strong> If students create actual shirts or merchandise using protected Orange Shirt Day wording or branding, teachers should check the Orange Shirt Society's current guidance and licensing information first. A classroom art activity does not need to copy official logos or branded designs.</div>`},
{d:"OCTOBER 1",phase:"Future",t:"The shirt comes off. What stays?",b:`<div class="hero"><div class="bigshirt finalshirt" id="fadeShirt">SEPT<br>30</div><button class="btn secondary" onclick="document.getElementById('fadeShirt').classList.toggle('fade')">Take off the shirt →</button><h3>Tomorrow is October 1.</h3><p style="font-size:1.25rem"><strong>If you take off your orange shirt, what learning stays with you?</strong></p><div class="web"><span class="node">Learn</span><span class="node">Listen</span><span class="node">Remember</span><span class="node">Support</span><span class="node">Question</span><span class="node">Act</span></div></div>`},
{d:"365",phase:"Future",t:"Reconciliation doesn't have an expiry date.",b:`<p>Choose one small way to keep learning during the year. These are starting points, not a checklist that “finishes” reconciliation.</p><div class="calendar">
<div class="month"><strong>September</strong>Learn Phyllis's story and the history behind Orange Shirt Day.</div>
<div class="month"><strong>October</strong>Explore a community-led Indigenous language resource.</div>
<div class="month"><strong>November</strong>Read an Indigenous author or graphic novelist.</div>
<div class="month"><strong>December</strong>Discover Indigenous artists, creators or businesses.</div>
<div class="month"><strong>January</strong>Explore several TRC Calls to Action.</div>
<div class="month"><strong>February</strong>Investigate Indigenous innovation, science or environmental leadership.</div>
<div class="month"><strong>March</strong>Learn about a local Nation, treaty or land relationship.</div>
<div class="month"><strong>April</strong>Explore Indigenous-led land or water stewardship.</div>
<div class="month"><strong>May</strong>Learn about Indigenous governance and self-determination.</div>
<div class="month"><strong>June</strong>Explore National Indigenous History Month through Indigenous voices.</div>
</div>`},
{d:"YOUR TURN",phase:"Truth • Resilience • Future",t:"The shirt comes off. The learning doesn't.",b:`<p>You began with a simple question: <strong>Why orange?</strong> Now you have travelled from one child's story to a national system, from interruption to reclamation, from remembrance to contemporary Indigenous excellence, and from awareness toward continuing action.</p><div class="decision"><div class="eyebrow">Final Reflection — Grades 9–12</div><h3>Orange Shirt Day asks Canadians to remember what happened. What should it ask us to do next?</h3><p>Using what you discovered in this experience, explain how learning the <strong>truth about residential schools</strong>, recognizing <strong>Indigenous resilience and contemporary success</strong>, and taking <strong>meaningful action throughout the year</strong> can contribute to reconciliation.</p><p><strong>Use at least three specific examples from the interactive.</strong></p></div><div class="decision"><div class="eyebrow">Final Reflection — Grades 7–8</div><h3>Why does Orange Shirt Day matter, and what is one thing people can continue learning or doing after September 30?</h3><p>Use examples from your journey to explain your thinking.</p></div><p class="source">Complete your teacher's chosen response format: written, verbal/video, discussion, art reflection or another classroom format.</p>`}
];

let i=0,max=0,choices={};
const stage=document.getElementById("stage"),bar=document.getElementById("bar"),journey=document.getElementById("journey"),back=document.getElementById("back"),next=document.getElementById("next");
function render(){
 const s=stages[i];max=Math.max(max,i);bar.style.width=((i+1)/stages.length*100)+"%";
 journey.innerHTML=stages.map((x,j)=>j<=max?`<button class="tick ${j===i?'active':''}" data-j="${j}">${x.d}</button>`:`<span class="tick lock">🔒</span>`).join("");
 let h=`<div class="eyebrow">${s.phase} · ${i+1} of ${stages.length}</div><h2>${s.t}</h2>${s.b}`;
 if(s.q){
   const pick=choices[i], f=(pick!==undefined?s.f[pick]:null);
   h+=`<div class="decision"><div class="eyebrow">Think & Choose</div><p><strong>${s.q}</strong></p>${s.o.map((o,j)=>`<button class="choice ${pick===j?'selected':''}" data-choice="${j}">${o}</button>`).join("")}${f?`<div class="feedback"><strong>${f[0]}.</strong> ${f[1]}</div>`:""}<p class="source">There is no score. Use the feedback to strengthen your thinking.</p></div>`;
 }
 stage.innerHTML=h;
 stage.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{choices[i]=+b.dataset.choice;render()});
 stage.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.reveal)?.classList.toggle("show"));
 journey.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{i=+b.dataset.j;render();window.scrollTo({top:0,behavior:"smooth"})});
 back.disabled=i===0;next.disabled=i===stages.length-1;next.textContent=i===stages.length-1?"Journey Complete":"Continue →";
}
back.onclick=()=>{if(i){i--;render();window.scrollTo({top:0,behavior:"smooth"})}};
next.onclick=()=>{if(i<stages.length-1){i++;render();window.scrollTo({top:0,behavior:"smooth"})}};
render();
</script>
</body></html>
